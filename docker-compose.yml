# Sobe a aplicação com o banco SQLite persistido em um volume nomeado.
# Uso: docker compose up -d --build
#
# `name` fixa o nome do projeto. Sem isso, o Compose deriva o nome do projeto da
# pasta atual ("InventárioHardware[2]" → normaliza p/ "inventriohardware2"), o
# que muda o volume usado conforme a pasta e pode subir com banco VAZIO. Fixar o
# nome torna o ambiente estável e independente do nome da pasta.
name: inventario-cobratec

services:
  app:
    build: .
    image: inventario-cobratec
    container_name: inventario-cobratec
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "file:/app/data/dev.db"
      # Porta usada pelo server standalone do Next (casa com o healthcheck).
      PORT: "3000"
      # Segredo que assina o cookie de sessão. OBRIGATÓRIO: o entrypoint recusa
      # subir sem ele (ver .env.example para gerar um valor).
      AUTH_SECRET: "${AUTH_SECRET:?defina AUTH_SECRET no .env do servidor}"
      # Administrador inicial — criado no boot só se não houver nenhum admin
      # ativo. Senha em branco = sorteada e impressa uma vez em `docker compose
      # logs`. Em ambos os casos nasce provisória.
      ADMIN_INICIAL_LOGIN: "${ADMIN_INICIAL_LOGIN:-admin}"
      ADMIN_INICIAL_SENHA: "${ADMIN_INICIAL_SENHA:-}"
    volumes:
      # Persiste o dev.db entre reinícios/rebuilds do container.
      - inventario-db:/app/data
    restart: unless-stopped
    # wget vem do busybox da imagem Alpine. /api/health checa app + banco.
    # Usar 127.0.0.1 (IPv4) e não "localhost": o busybox resolve localhost para
    # ::1 (IPv6) e o server standalone do Next escuta em 0.0.0.0 (IPv4) → recusa.
    healthcheck:
      test:
        ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  # Volume gerenciado pelo Compose (criado automaticamente no primeiro `up`).
  # Portável: funciona em qualquer host — sua máquina, a VM da Oracle, etc. Os
  # dados do SQLite ficam aqui e sobrevivem a rebuilds/updates. Para mover de
  # máquina, restaure um backup do dev.db dentro deste volume antes de subir
  # (passo a passo em docs/deploy.md).
  inventario-db:
